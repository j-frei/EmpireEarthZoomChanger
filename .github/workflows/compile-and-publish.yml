name: Build Qt5 i686 Windows App (Static Qt MSVC x86)

on:
  push:
    branches:
      - master
    paths:
      - '*.cpp'
      - '*.h'
      - '*.pro'
      - '.github/workflows/compile-and-publish.yml'
  pull_request: {}
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        shell: powershell
        run: |
          choco install strawberryperl python3 -y
          git config --global core.autocrlf false

      - name: Cache static Qt build
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: C:\QtInstall
          key: qt-5.15.2-static-msvc-x86-qtbase-v1

      - name: Download Qt 5.15.2 qtbase Source
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl.exe -LO https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtbase-everywhere-src-5.15.2.zip
          tar -xf qtbase-everywhere-src-5.15.2.zip
          ren qtbase-everywhere-src-5.15.2 QtSrc

      - name: Configure Qt for Static MSVC x86
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2026\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          cd QtSrc
          configure -static -release -platform win32-msvc ^
            -prefix C:\QtInstall ^
            -opensource -confirm-license ^
            -nomake examples -nomake tests

      - name: Build and Install Static Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2026\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          cd QtSrc
          nmake
          nmake install

      - name: Build EmpireEarthZoomChanger
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2026\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          set PATH=C:\QtInstall\bin;%PATH%
          qmake CONFIG+=release EmpireEarthZoomChanger.pro
          nmake

      - name: Set tag name (YYYY-MM-DD)
        id: set_date_tag
        shell: bash
        run: |
          echo "now=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/EmpireEarthZoomChanger.exe
          name: Compiled CI/CD artifact
          body: "Latest i686 (x32) Qt5 app built automatically by GitHub Actions"
          tag_name: "release-${{ steps.set_date_tag.outputs.now }}"
